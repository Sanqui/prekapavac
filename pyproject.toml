[project]
name = "prekapavac"
version = "0.0.0"
description = "Collaborative translation of terminology"
readme = "README.md"
license = "ISC"
requires-python = ">=3.13"
dependencies = [
    "bcrypt",
    "diffhtml",
    "flask",
    "flask-admin",
    "flask-bcrypt",
    "flask-debugtoolbar",
    "flask-login",
    "flask-sqlalchemy",
    "gunicorn",
    "markdown",
    "psycopg2-binary",
    "sqlalchemy",
    "tqdm",
    "unidecode",
    "wtforms",
]

[dependency-groups]
dev = [
    "pylint",
]

