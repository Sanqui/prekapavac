[project]
name = "prekapavac"
version = "0.0.0"
description = "Collaborative translation of terminology"
readme = "README.md"
license = "ISC"
requires-python = ">=3.8"
dependencies = [
    "bcrypt<4",
    "diffhtml",
    "flask<2",
    "flask-admin<1.6",
    "flask-bcrypt<0.8",
    "flask-debugtoolbar<0.12",
    "flask-login<0.6",
    "flask-markdown",
    "flask-sqlalchemy<3",
    "gunicorn",
    "psycopg2-binary<3",
    "sqlalchemy<1.4",
    "tqdm",
    "unidecode<2",
    "wtforms<3",
]

[dependency-groups]
dev = [
    "pylint",
]

[tool.uv]
# Jinja2 2.x (required by Flask 1.x) uses markupsafe.soft_unicode, removed in MarkupSafe 2.1
constraint-dependencies = ["markupsafe<2.1"]
